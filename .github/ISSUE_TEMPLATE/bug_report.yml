name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve music-migrator. Do not include credentials or session files.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Include the command, with credentials removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: music-migrator --version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12.8 on Ubuntu 22.04 under WSL2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove credentials, tokens, IDs, and personal data first.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data
      options:
        - label: I removed credentials, tokens, session data, and personal music data.
          required: true
