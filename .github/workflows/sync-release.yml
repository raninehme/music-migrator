name: Sync release branch

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check whether release needs synchronization
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          behind_by="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/compare/main...release" \
              --jq '.behind_by'
          )"
          if [ "$behind_by" -eq 0 ]; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "release already contains main"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or reuse main-to-release pull request
        if: steps.compare.outputs.needs_sync == 'true'
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base release \
              --head main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$pr_number" ]; then
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base release \
                --head main \
                --title "Sync main into release" \
                --body "Synchronize release history after a successful release. This PR must use a merge commit, never squash or rebase."
            )"
            pr_number="${pr_url##*/}"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Queue merge-commit synchronization
        if: steps.compare.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.sync.outputs.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge
